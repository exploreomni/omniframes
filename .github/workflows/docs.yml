name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (blank updates dev from main)"
        required: false
        type: string

permissions:
  contents: read

# Serialize the entire read/build/write cycle so versions cannot overwrite each other.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Persist generated versions on gh-pages; never modify source branches.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: uv sync --frozen --all-extras
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build versioned docs
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          docs_tag="$REQUESTED_TAG"
          docs_version=dev
          if [[ -n "$docs_tag" ]]; then
            if [[ ! "$docs_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "Expected an existing release tag such as v0.1.0" >&2
              exit 1
            fi
            git rev-parse --verify "refs/tags/$docs_tag^{commit}"
            git merge-base --is-ancestor "refs/tags/$docs_tag" origin/main
            git checkout --detach "refs/tags/$docs_tag"
            docs_version="${docs_tag#v}"
          fi
          # Install tools before checkout so older releases can be backfilled with this workflow.
          # INHERIT keeps the release's docs and theme, adding versioning even to pre-mike releases.
          cat > mkdocs-versioned.yml <<'CONFIG'
          INHERIT: mkdocs.yml
          site_url: https://exploreomni.github.io/omniframes/
          strict: true
          extra:
            version:
              provider: mike
          CONFIG
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git branch gh-pages origin/gh-pages
          fi
          .venv/bin/mike deploy --config-file mkdocs-versioned.yml \
            --message "docs: publish $docs_version" "$docs_version"
          # Choose the newest published stable version numerically. Backfills and prereleases
          # must never move stable backwards or make unreleased main the default.
          git show gh-pages:versions.json > .docs-versions.json
          docs_stable="$(.venv/bin/python - <<'PYTHON'
          import json
          import re
          from pathlib import Path
          versions = [entry["version"] for entry in json.loads(Path(".docs-versions.json").read_text())]
          stable = [version for version in versions if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)]
          print(max(stable, key=lambda version: tuple(map(int, version.split(".")))) if stable else "")
          PYTHON
          )"
          docs_default="$docs_version"
          if [[ -n "$docs_stable" ]]; then
            .venv/bin/mike alias --config-file mkdocs-versioned.yml --update-aliases \
              --alias-type redirect --message "docs: update stable documentation alias" "$docs_stable" stable
            docs_default=stable
          elif git cat-file -e gh-pages:dev/index.html 2>/dev/null; then
            docs_default=dev
          fi
          .venv/bin/mike set-default --config-file mkdocs-versioned.yml \
            --message "docs: set default documentation version" "$docs_default"
          mkdir -p pages-site
          git archive gh-pages | tar -x -C pages-site
      - name: Persist versions
        run: git push origin gh-pages
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
