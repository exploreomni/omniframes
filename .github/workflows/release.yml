name: Release

# Only a maintainer's explicit v* tag push can publish. Dispatch is validation-only,
# including when dispatched against a tag. See docs/releasing.md for one-time setup.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --locked
      - name: Validate tagged checkout and extract reviewed notes
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/prepare_release.py validate "$RELEASE_TAG" --notes-output release-notes.md
      - name: Build distributions
        run: uv build
      - name: Validate metadata
        run: uv run --with twine twine check --strict dist/*
      - name: Smoke-install both distributions outside the checkout
        run: |
          export EXPECTED_VERSION
          EXPECTED_VERSION=$(uv run python -c 'import omniframes; print(omniframes.__version__)')
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv venv --clear /tmp/omniframes-smoke --python 3.12
            uv pip install --python /tmp/omniframes-smoke/bin/python "$artifact"
            (cd /tmp && /tmp/omniframes-smoke/bin/python -c 'import os; from importlib.metadata import version; from importlib.resources import files; import omniframes; assert omniframes.__version__ == version("omniframes") == os.environ["EXPECTED_VERSION"]; assert files("omniframes").joinpath("py.typed").is_file(); print(version("omniframes"))')
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omniframes
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Create draft, attach artifacts, and publish GitHub Release
        shell: bash
        run: |
          # A retry after successful publication leaves the existing release intact.
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft.txt; then
            if [ "$(cat draft.txt)" = false ]; then exit 0; fi
          else
            flags=()
            if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
